name: نشر لعبة جمل الصحراء

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: تنزيل المشروع
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت المكتبات
        run: npm ci

      - name: بناء نسخة GitHub Pages
        run: npm run build:pages

      - name: إعداد GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: رفع ملفات اللعبة
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: نشر اللعبة
        id: deployment
        uses: actions/deploy-pages@v4
